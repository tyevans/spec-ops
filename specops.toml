[project]
name = "SpecOps"
repo = ""
docs_dir = "docs/project"
site_output = "dist/site"

[architecture]
file_length_limit = 500
buffer_target = 10
buffer_warning_threshold = 6

components = [
  { id = "core", name = "Core Engine", path = "src" }
]

[architecture.layers]
cli = 5
visualizer = 4
tui = 4
worker = 3
rescue = 3
scaffold = 3
release = 3
backlog = 2
prd = 2
adrs = 2
graph = 2
profiles = 2
spike = 2
core = 1
security = 1
docs = 1
config = 0

[architecture.independent_contexts]
pairs = [
  ["visualizer", "tui"]
]

[vertical_slices]
slices = [
  { type = "spike", name = "Architectural Spike", prefix = "SPIKE:", requires_adr = true },
  { type = "domain", name = "Domain Model & State Handlers" },
  { type = "api", name = "Public API Contracts" },
  { type = "ui", name = "User Interface & Component Stories" },
  { type = "test", name = "Blackbox Frontdoor Test Suite" }
]

[quality]
testing_style = "blackbox-frontdoor"
require_bdd = true
preflight = [
  "uv run pytest"
]

[execution]
agent_command = "agy --dangerously-skip-permissions -p {prompt}"
agent_max_attempts = 3
git_branch_prefix = "feat/"
backlog_isolation = true

[security.licenses]
profile = "permissive"
allowed = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Unlicense",
  "Python-2.0",
  "CC0-1.0",
  "PSF-2.0",
  "MPL-2.0",
  "CNRI-Python"
]

[security]
secret_scanning = true
lockfile_immutability = true
enforce_lockfile = true
sandbox_enabled = true
allowed_commands = ["pytest", "git", "uv"]
reporting_contact = "security@example.com"

[security.compliance]
require_signed_commits = true
dual_custody = true
allowed_signers_file = ".ssh/allowed_signers"
authorized_signers = [
  "Ty Evans <tyler@poorlythoughtout.com>",
  "Tyler Evans <tyevans@gmail.com>",
]

