[project]
name = "spec-ops"
version = "0.1.0"
description = "SpecOps: Opinionated Project Management as Code and Autonomous Delivery Engine"
readme = "README.md"
authors = [
    { name = "Ty Evans", email = "tyler@poorlythoughtout.com" }
]
requires-python = ">=3.13"
dependencies = [
    "eventsource-py>=0.8.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "pyyaml>=6.0.1",
    "redstring>=0.11.0",
    "rich>=15.0.0",
]

[project.scripts]
spec-ops = "spec_ops.cli.main:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "pytest>=8.0.0",
    "pytest-bdd>=8.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/spec_ops"]
only_mutate = [
    "src/spec_ops/backlog/health.py*",
    "src/spec_ops/backlog/reconciler.py*",
    "src/spec_ops/backlog/slicer.py*",
    "src/spec_ops/prd/linter.py*",
    "src/spec_ops/prd/lifecycle.py*",
    "src/spec_ops/prd/delta.py*",
    "src/spec_ops/security/secrets/entropy.py*",
    "src/spec_ops/security/secrets/patterns.py*",
    "src/spec_ops/security/interceptor.py*",
    "src/spec_ops/prd/studio.py*",
    "src/spec_ops/prd/step_assistant.py*",
    "src/spec_ops/spike/graduate.py*",
    "src/spec_ops/security/licenses/policy.py*",
    "src/spec_ops/security/waivers.py*",
    "src/spec_ops/security/signing.py*",
    "src/spec_ops/security/dual_custody.py*",
    "src/spec_ops/worker/claimer.py*",
    "src/spec_ops/worker/guardrails.py*",
    "src/spec_ops/core/spikes/cache_spike.py*",
]
pytest_add_cli_args_test_selection = [
    "tests/test_backlog_health_and_curator.py",
    "tests/test_reconciler_and_slicer.py",
    "tests/test_curation_properties.py",
    "tests/test_bdd_us0116.py",
    "tests/test_hypothesis_properties.py",
    "tests/test_bdd_scenarios.py",
    "tests/test_task_decider.py",
    "tests/test_security_profile.py",
    "tests/test_prd_linter.py",
    "tests/test_prd_lifecycle.py",
    "tests/test_prd_delta.py",
    "tests/test_secrets_scanner.py",
    "tests/test_worker_sandboxing.py",
    "tests/test_security_properties.py",
    "tests/test_bdd_sandbox_scenarios.py",
    "tests/test_prd_studio.py",
    "tests/test_step_assistant.py",
    "tests/test_bdd_prd_studio.py",
    "tests/test_prd_studio_properties.py",
    "tests/test_spike_unit.py",
    "tests/test_spike_graduate.py",
    "tests/test_dependency_audit.py",
    "tests/test_security_waivers_properties.py",
    "tests/test_bdd_us0057_us0112.py",
    "tests/test_signing_properties.py",
    "tests/test_signing_unit.py",
    "tests/test_bdd_us0055_us0113.py",
    "tests/test_worker_claimer.py",
    "tests/test_worker_guardrails.py",
    "tests/test_bdd_claim_gates.py",
    "tests/test_bdd_guardrails.py",
    "tests/test_cache_spike.py",
]
runner = "pytest"

[tool.importlinter]
root_package = "spec_ops"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "SpecOps Bounded Context Layers"
type = "layers"
layers = [
    "spec_ops.cli",
    "spec_ops.app",
    "spec_ops.visualizer | spec_ops.tui",
    "spec_ops.worker : spec_ops.rescue : spec_ops.scaffold : spec_ops.release",
    "spec_ops.backlog : spec_ops.prd : spec_ops.adrs : spec_ops.graph : spec_ops.profiles : spec_ops.spike",
    "spec_ops.core : spec_ops.security : spec_ops.docs",
    "spec_ops.config",
]
ignore_imports = [
    "spec_ops.security.dual_custody -> spec_ops.rescue.handover",
    "spec_ops.security.sandbox -> spec_ops.worker.sandbox_env",
    "spec_ops.backlog.milestone_briefing -> spec_ops.visualizer.burndown_deck",
    "spec_ops.backlog.rollover -> spec_ops.visualizer.burndown_deck",
    "spec_ops.backlog.worker -> spec_ops.worker.*",
    "spec_ops.backlog.queue -> spec_ops.worker.*",
    "spec_ops.backlog.rescue -> spec_ops.worker.*",
    "spec_ops.backlog.prompts -> spec_ops.worker.*",
    "spec_ops.backlog.rescue -> spec_ops.rescue.*",
    "spec_ops.backlog.worker -> spec_ops.rescue.*",
    "spec_ops.backlog.velocity -> spec_ops.rescue.memory",
    "spec_ops.spike.sandbox -> spec_ops.worker.worktree",
    "spec_ops.spike.graduate -> spec_ops.worker.worktree",
]



